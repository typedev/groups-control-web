[project]
name = "gcweb-spike"
version = "0.0.0"
description = "Phase 0 spike (throwaway): ufo-spacing-lib on ufoLib2 through a tracked adapter"
requires-python = ">=3.12"
dependencies = [
    "ufoLib2",
    "fonttools",
    "ufo-spacing-lib==0.4.3",
]

[dependency-groups]
dev = ["pytest"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
